name: Desktop release
on:
  push:
    tags: ['desktop-v*']
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  desktop:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win --x64
            artifact: windows
          - os: macos-latest
            args: --mac --x64 --arm64
            artifact: macos
          - os: ubuntu-latest
            args: --linux --x64
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Verify release version
        run: node -e "const root=require('./package.json').version; const desktop=require('./apps/desktop/package.json').version; if (!/^desktop-v[0-9]+[.][0-9]+[.][0-9]+$/.test(process.env.GITHUB_REF_NAME) || process.env.GITHUB_REF_NAME !== 'desktop-v'+root || root !== desktop) process.exit(1)"
      - run: npm ci
      - run: npm run build:desktop
      - run: npx electron-builder --config electron-builder.yml ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.artifact }}
          path: |
            release/desktop/*.exe
            release/desktop/*.zip
            release/desktop/*.dmg
            release/desktop/*.AppImage
          if-no-files-found: error
  release:
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: artifacts
          merge-multiple: true
      - name: Publish desktop release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "Desktop_${GITHUB_REF_NAME#desktop-v}" --generate-notes
          fi
