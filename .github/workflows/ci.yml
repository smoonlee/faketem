name: CI
on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm run build:server
      - run: npm run build:desktop
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --pull -t atem-sandbox:ci .
      - name: Smoke test container
        run: |
          docker run -d --name atem-sandbox-ci -p 127.0.0.1:3000:3000 -p 127.0.0.1:9910:9910/udp atem-sandbox:ci
          trap 'docker logs atem-sandbox-ci; docker rm -f atem-sandbox-ci' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/v1/health; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Scan image for fixable vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: atem-sandbox:ci
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
